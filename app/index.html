<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paul Deveau · ML Engineering Leader</title>
    <meta
      name="description"
      content="Paul Deveau, PhD: ML engineering leader in LLM agents, evaluation and data platforms (ex-Meta, ex-Ubisoft). From cancer genomics to AI agents."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Paul Deveau · ML Engineering Leader" />
    <meta property="og:description" content="From cancer genomics to AI agents. Resume, or play it as a platformer." />
    <meta property="og:url" content="https://deveaup.github.io/" />
    <meta property="og:image" content="https://deveaup.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Pixel-art platformer: a player in Polytechnique uniform between École Polytechnique and Paris Descartes, with diplomas on floating platforms, next to the resume panel." />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Paul Deveau",
        "honorificSuffix": "PhD",
        "jobTitle": "ML Engineering Leader",
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "École Polytechnique" },
          { "@type": "CollegeOrUniversity", "name": "Université Paris-Sud" },
          { "@type": "CollegeOrUniversity", "name": "Université Paris Descartes" }
        ],
        "url": "https://deveaup.github.io/",
        "sameAs": [
          "https://www.linkedin.com/in/deveaupaul/",
          "https://github.com/DeveauP",
          "https://scholar.google.com/citations?user=ekPsJ_cAAAAJ"
        ]
      }
    </script>

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">
        Paul Deveau, PhD: ML engineering leader (ex-Meta, ex-Ubisoft).
        <a href="https://www.linkedin.com/in/deveaupaul/">LinkedIn</a> ·
        <a href="https://github.com/DeveauP">GitHub</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
